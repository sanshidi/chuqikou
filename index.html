<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="出气口 — 雨夜巷口的情绪释放站。写完即毁，本地小游戏减压，内容从不上传。" />
  <meta name="theme-color" content="#0c0a12" />
  <title>出气口 · 雨夜巷口·写完就散</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="rain" aria-hidden="true"></div>
  <div class="steam-bg" id="steamBg" aria-hidden="true"></div>

  <div class="app">
    <header class="hero">
      <p class="hero-kicker">雨夜巷口 · 本地减压站</p>
      <h1 class="logo">出气口</h1>
      <p class="tagline">堵着就来这儿泄一泄。写的只在本机，玩完可以缓一缓。</p>

      <button type="button" class="vent-valve" id="ventValve" aria-label="点一下，放一股蒸汽">
        <span class="valve-ring"></span>
        <span class="valve-core" id="valveCore">
          <span class="valve-label">泄压</span>
        </span>
        <span class="valve-steam" id="valveSteam"></span>
      </button>

      <section class="mood-bar" aria-label="情绪强度">
        <label for="mood" class="mood-label">
          此刻堵得有多满 <strong id="moodValue">5</strong>
        </label>
        <input type="range" id="mood" min="0" max="10" value="5" class="mood-slider" />
        <div class="mood-ends"><span>还行</span><span>快炸了</span></div>
      </section>
    </header>

    <!-- Write & destroy ritual -->
    <section class="panel ritual" aria-label="写下情绪">
      <div class="panel-sign">
        <span class="sign-glow">写完就散</span>
      </div>
      <label for="ventText" class="sr-only">写下想发泄的话</label>
      <div class="textarea-wrap" id="textareaWrap">
        <textarea
          id="ventText"
          rows="4"
          maxlength="2000"
          placeholder="想骂的、堵着的、说不出口的……写在这儿。不会上传，刷新就没了。"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <div class="shred-overlay" id="shredOverlay" aria-hidden="true"></div>
      </div>
      <p class="privacy-note" role="note">内容只留在本机浏览器，刷新即清空；不上传服务器。</p>
      <div class="destroy-actions">
        <button type="button" class="neon-btn magenta" id="btnShred" disabled>撕碎</button>
        <button type="button" class="neon-btn violet" id="btnVoid" disabled>吸入虚空</button>
        <button type="button" class="neon-btn cyan" id="btnBalloon" disabled>气球放飞</button>
      </div>
    </section>

    <div class="balloon-layer" id="balloonLayer" aria-hidden="true"></div>

    <!-- Game arcade hub -->
    <section class="arcade" aria-label="出气小游戏">
      <div class="panel-sign">
        <span class="sign-glow cyan">夜市出气摊</span>
      </div>
      <p class="arcade-hint">点一个摊位开玩 · 全是抽象物件，纯本地</p>
      <div class="stall-grid" id="stallGrid">
        <button type="button" class="stall" data-game="bag">
          <span class="stall-icon" aria-hidden="true">🥊</span>
          <span class="stall-name">出气袋</span>
          <span class="stall-desc">连点把劲儿打出去</span>
        </button>
        <button type="button" class="stall" data-game="bubble">
          <span class="stall-icon" aria-hidden="true">🫧</span>
          <span class="stall-name">泡泡膜</span>
          <span class="stall-desc">一格格戳破</span>
        </button>
        <button type="button" class="stall" data-game="plates">
          <span class="stall-icon" aria-hidden="true">🍽️</span>
          <span class="stall-name">砸盘子</span>
          <span class="stall-desc">点一下就碎</span>
        </button>
        <button type="button" class="stall" data-game="balloons">
          <span class="stall-icon" aria-hidden="true">🎈</span>
          <span class="stall-name">气球扎破</span>
          <span class="stall-desc">戳浮起来的气球</span>
        </button>
        <button type="button" class="stall" data-game="rage">
          <span class="stall-icon" aria-hidden="true">⌨️</span>
          <span class="stall-name">键盘宣泄</span>
          <span class="stall-desc">狂按填满怒气条</span>
        </button>
        <button type="button" class="stall" data-game="squeeze">
          <span class="stall-icon" aria-hidden="true">🟡</span>
          <span class="stall-name">捏压力球</span>
          <span class="stall-desc">按住捏扁再弹回</span>
        </button>
        <button type="button" class="stall" data-game="shredder">
          <span class="stall-icon" aria-hidden="true">📄</span>
          <span class="stall-name">碎纸机</span>
          <span class="stall-desc">拖进去粉碎烦恼</span>
        </button>
        <button type="button" class="stall" data-game="whack">
          <span class="stall-icon" aria-hidden="true">🔥</span>
          <span class="stall-name">消火</span>
          <span class="stall-desc">戳灭冒出来的火</span>
        </button>
        <button type="button" class="stall" data-game="notes">
          <span class="stall-icon" aria-hidden="true">📝</span>
          <span class="stall-name">甩飞便签</span>
          <span class="stall-desc">把烦心事甩出屏幕</span>
        </button>
        <button type="button" class="stall" data-game="breakout">
          <span class="stall-icon" aria-hidden="true">🧱</span>
          <span class="stall-name">碎砖块</span>
          <span class="stall-desc">打掉烦恼砖墙</span>
        </button>
      </div>
    </section>

    <!-- Breathing -->
    <section class="panel breathe-section" id="breatheSection" aria-label="呼吸引导" hidden>
      <div class="panel-sign"><span class="sign-glow cyan">缓一缓</span></div>
      <p class="hint" id="breatheHint">跟着光圈：吸气…停…呼气…</p>
      <div class="breathe-wrap">
        <div class="breathe-circle" id="breatheCircle" aria-live="polite">
          <span class="breathe-text" id="breatheText">准备</span>
        </div>
      </div>
      <div class="breathe-actions">
        <button type="button" class="neon-btn cyan" id="btnBreatheStart">开始 45 秒</button>
        <button type="button" class="ghost-btn" id="btnBreatheSkip">收起来</button>
      </div>
    </section>

    <div class="offer-breathe" id="offerBreathe" hidden>
      <p>劲儿泄出去了。要不要跟着呼吸缓一会儿？</p>
      <button type="button" class="neon-btn cyan" id="btnOfferYes">好，呼吸一下</button>
      <button type="button" class="ghost-btn" id="btnOfferNo">先不用</button>
    </div>

    <footer class="footer">
      <p class="disclaimer">
        本页仅供情绪疏导小练习，不能替代专业心理咨询或医疗建议。
        若持续难受、有伤害自己的念头，请尽快寻求帮助。
      </p>
      <p class="hotlines">
        危机支持（中国大陆）：
        <a href="tel:4001619995">400-161-9995</a>
        （希望24热线）·
        <a href="https://www.lifeline.org.cn/" target="_blank" rel="noopener noreferrer">生命热线</a>
      </p>
      <p class="footer-meta">出气口 · 纯本地静态页 · 无账号 · 无上传</p>
    </footer>
  </div>

  <!-- Game modal -->
  <div class="game-modal" id="gameModal" hidden>
    <div class="game-sheet" role="dialog" aria-modal="true" aria-labelledby="gameTitle">
      <header class="game-header">
        <h2 id="gameTitle">游戏</h2>
        <button type="button" class="ghost-btn close-game" id="btnCloseGame" aria-label="关闭">关掉</button>
      </header>
      <p class="game-hint" id="gameHint"></p>
      <div class="game-stage" id="gameStage"></div>
      <div class="game-toolbar">
        <span class="game-stat" id="gameStat"></span>
        <button type="button" class="neon-btn magenta" id="btnResetGame">再来一局</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/games.js"></script>
</body>
</html>
