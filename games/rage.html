<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a12" />
  <meta name="description" content="出气口 · 键盘宣泄 — 本地发泄小游戏" />
  <title>键盘宣泄 · 出气口</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../styles-games.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
</head>
<body>
  <div class="game-page" data-game="rage">
    <header class="game-topbar">
      <a class="game-back" href="../index.html#arcade">← 巷口</a>
      <div class="game-title-block">
        <h1>键盘宣泄</h1>
        <p>狂按泄愤 · 一键爆发</p>
      </div>
      <button type="button" class="mute-btn" id="muteBtn" aria-label="静音">🔊</button>
    </header>
    <main class="game-stage-full" id="stage" aria-label="键盘宣泄舞台"></main>
    <footer class="game-hud">
      <div class="game-hud-stats" id="hudStats">准备中…</div>
      <div class="game-hud-tip">狂按键盘或猛点屏幕填满怒气，满格后爆发释放。</div>
    </footer>
  </div>
  <script src="../js/game-core.js"></script>
  <script src="../js/games/rage.js"></script>
</body>
</html>
