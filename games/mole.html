<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a12" />
  <meta name="description" content="出气口 · 怒戳地鼠 — 本地发泄小游戏" />
  <title>怒戳地鼠 · 出气口</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../styles-games.css" />
    <link rel="preload" href="../audio/thud.wav" as="audio" type="audio/wav" />
  <link rel="preload" href="../audio/whoosh.wav" as="audio" type="audio/wav" />
  <link rel="preload" href="../audio/pop.wav" as="audio" type="audio/wav" />
  <link rel="manifest" href="../manifest.webmanifest" />
</head>
<body>
  <div class="game-page" data-game="mole">
    <header class="game-topbar" role="banner">
      <a class="game-back" href="../index.html#arcade">← 巷口</a>
      <div class="game-title-block">
        <h1>怒戳地鼠</h1>
        <p>怒戳地鼠</p>
      </div>
      <div class="game-audio-controls">
        <button type="button" class="test-sfx-btn" id="testSfxBtn" aria-label="测试音效是否可听">测试音效</button>
        <button type="button" class="mute-btn" id="muteBtn" aria-label="静音切换">🔊</button>
      </div>
    </header>
    <main class="game-stage-full" id="stage" aria-label="怒戳地鼠舞台"></main>
    <footer class="game-hud" role="contentinfo">
      <div class="game-hud-stats" id="hudStats">待命 · 点一下开始</div>
      <div class="game-hud-tip">地鼠弹起立刻猛戳。金色大靶多戳几下更爽。</div>
    </footer>
  </div>
  <script src="../js/game-core.js"></script>
  <script src="../js/games/mole.js"></script>
</body>
</html>
